<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Sanjivani</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1d4150"/>
      <stop offset="0.45" stop-color="#0f2033"/>
      <stop offset="1" stop-color="#070b17"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd877" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#f3a93f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f3a93f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="196" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#245a56"/>
      <stop offset="0.45" stop-color="#143640"/>
      <stop offset="1" stop-color="#0a1621"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a4c"/>
      <stop offset="1" stop-color="#0d1c2b"/>
    </linearGradient>
    <linearGradient id="stem" x1="256" y1="204" x2="256" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="0.55" stop-color="#7fe0a0"/>
      <stop offset="1" stop-color="#5fd18a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2832b" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#f4a63c"/>
      <stop offset="0.5" stop-color="#ffd36a"/>
      <stop offset="0.7" stop-color="#f4a63c"/>
      <stop offset="1" stop-color="#e2832b" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="leafL" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f9e62"/>
      <stop offset="1" stop-color="#8ef0a6"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e62"/>
      <stop offset="1" stop-color="#8ef0a6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="92" cy="118" r="1.8" opacity="0.55"/>
    <circle cx="148" cy="72" r="1.2" opacity="0.4"/>
    <circle cx="372" cy="70" r="1.6" opacity="0.5"/>
    <circle cx="430" cy="140" r="1.2" opacity="0.4"/>
    <circle cx="118" cy="210" r="1.1" opacity="0.35"/>
    <circle cx="404" cy="230" r="1.4" opacity="0.4"/>
    <circle cx="196" cy="48" r="1" opacity="0.35"/>
    <circle cx="330" cy="168" r="1" opacity="0.3"/>
  </g>

  <g transform="translate(0 22)">
  <!-- the herb's glow over the mountain -->
  <circle cx="256" cy="150" r="170" fill="url(#halo)"/>

  <!-- distant Himalayan ridge -->
  <path d="M-10 344 L40 300 L92 326 L150 262 L204 320 L230 300 L256 320 L290 296 L330 330 L378 268 L430 318 L470 290 L522 330 L522 522 L-10 522 Z"
        fill="url(#far)" opacity="0.85"/>

  <!-- Dronagiri: the mountain is the heartbeat -->
  <path d="M-10 344 L150 344 Q167 318 184 344 L212 344 L226 362 L256 196 L288 384 L306 344 L336 344 Q362 312 388 344 L522 344 L522 522 L-10 522 Z"
        fill="url(#hill)"/>
  <path d="M-10 344 L150 344 Q167 318 184 344 L212 344 L226 362 L256 196 L288 384 L306 344 L336 344 Q362 312 388 344 L522 344"
        fill="none" stroke="url(#pulse)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- the Sanjivani herb on the peak -->
  <g filter="url(#glow)">
    <path d="M256 204 C249 178 263 152 256 124" fill="none" stroke="url(#stem)" stroke-width="8" stroke-linecap="round"/>
    <path d="M254 172 C232 158 210 156 186 132 C216 124 246 140 254 172 Z" fill="url(#leafL)"/>
    <path d="M258 150 C280 132 304 128 328 102 C296 96 266 114 258 150 Z" fill="url(#leafR)"/>
    <path d="M252 168 C236 156 220 150 200 136" fill="none" stroke="#c9ffd6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M261 146 C278 132 296 124 316 108" fill="none" stroke="#c9ffd6" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- the life-giving spark -->
  <path d="M256 66 Q260 98 290 104 Q260 110 256 142 Q252 110 222 104 Q252 98 256 66 Z"
        fill="#ffe7a0" filter="url(#bigglow)"/>
  <circle cx="256" cy="104" r="7" fill="#fffaf0"/>

  <!-- the herbs that glowed on Dronagiri's slopes -->
  <g fill="#9af2b3" filter="url(#glow)">
    <circle cx="241" cy="292" r="3.2" opacity="0.9"/>
    <circle cx="272" cy="306" r="2.6" opacity="0.8"/>
    <circle cx="236" cy="336" r="2.4" opacity="0.7"/>
    <circle cx="284" cy="352" r="2.8" opacity="0.75"/>
    <circle cx="252" cy="372" r="2" opacity="0.6"/>
    <circle cx="160" cy="380" r="2" opacity="0.45"/>
    <circle cx="362" cy="384" r="2.2" opacity="0.5"/>
  </g>

  <!-- embers rising -->
  <g fill="#ffd36a" filter="url(#glow)">
    <circle cx="212" cy="88" r="3" opacity="0.8"/>
    <circle cx="306" cy="70" r="2.4" opacity="0.7"/>
    <circle cx="186" cy="176" r="2" opacity="0.6"/>
    <circle cx="334" cy="150" r="2.6" opacity="0.65"/>
  </g>
  </g>
</svg>
